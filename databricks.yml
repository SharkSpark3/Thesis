bundle:
  name: thesis-rag-portfolio

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: workspace
  schema:
    description: Unity Catalog schema
    default: default
  volume:
    description: Unity Catalog volume
    default: thesis_project

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
