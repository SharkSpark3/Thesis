resources:
  jobs:
    thesis_rag_demo:
      name: thesis-rag-demo-${bundle.target}
      tasks:
        - task_key: langchain_rag_demo
          notebook_task:
            notebook_path: ../notebooks/14_langchain_databricks_demo.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              sample_size: "50"
          environment_key: default
        - task_key: evaluate_langchain_results
          depends_on:
            - task_key: langchain_rag_demo
          notebook_task:
            notebook_path: ../notebooks/15_evaluate_langchain_results.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              sample_size: "50"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - idna==3.11
              - protobuf==6.33.5
              - wcwidth==0.2.13
              - datasets>=2.19
              - faiss-cpu
              - langchain-community
              - langchain-huggingface
              - langchain-openai
              - langchain-text-splitters
              - sentence-transformers
              - openai
              - transformers
